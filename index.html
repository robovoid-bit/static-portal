    <style>
        /* --- GLOBAL STYLES & RESET --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- NAVBAR --- */
        .navbar {
            background-color: #1f2833;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            border-bottom: 2px solid #45f3ff;
            box-shadow: 0 4px 15px rgba(69, 243, 255, 0.2);
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #45f3ff;
        }

        .logo span {
            color: #45f3ff;
        }

        .search-container {
            flex: 0 1 400px;
            margin: 0 20px;
        }

        .search-bar {
            width: 100%;
            padding: 10px 20px;
            background-color: #0b0c10;
            border: 2px solid #c5c6c7;
            border-radius: 25px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            outline: none;
            border-color: #45f3ff;
            box-shadow: 0 0 10px #45f3ff;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border: 2px solid transparent;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: #45f3ff;
            border-color: #45f3ff;
            background-color: rgba(69, 243, 255, 0.05);
        }

        /* --- MAIN LAYOUT --- */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- SIDEBAR (Text-only games) --- */
        .sidebar {
            width: 260px;
            background-color: #151a21;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar h3 {
            color: #fff;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-list {
            list-style: none;
        }

        .sidebar-item {
            padding: 10px 12px;
            margin-bottom: 5px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
            font-size: 15px;
        }

        .sidebar-item:hover {
            background-color: #1f2833;
            color: #45f3ff;
        }

        /* --- GAME GRID AREA --- */
        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: radial-gradient(circle at top right, #11161d, #0b0c10);
        }

        .grid-title {
            color: #fff;
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        /* --- FORTNITE STYLE GAME CARDS --- */
        .game-card {
            background-color: #1f2833;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            aspect-ratio: 1 / 1; /* Keeps them perfectly square like Poki/CrazyGames */
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border: 3px solid transparent;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.25s ease;
        }

        .game-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 15px 10px 10px 10px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Fortnite Hover Effect: Scale Down + White Outline */
        .game-card:hover {
            transform: scale(0.93);
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* Smooth scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0c10;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2833;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #45f3ff;
        }

        const gameGrid = document.getElementById('gameGrid');
        const sidebarList = document.getElementById('sidebarList');
        const searchBar = document.getElementById('searchBar');

        // --- ABOUT:BLANK CLOAKING FUNCTION ---
        function launchGame(url) {
            const win = window.open('about:blank', '_blank');
            if (win) {
                win.document.body.style.margin = '0';
                win.document.body.style.height = '100vh';
                
                const iframe = win.document.createElement('iframe');
                iframe.style.border = 'none';
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.margin = '0';
                iframe.src = url;
                
                win.document.body.appendChild(iframe);
            } else {
                // Fallback if popup blocker stops it
                window.open(url, '_blank');
            }
        }

        // --- RENDER FUNCTION ---
        function renderGames(games) {
            // Clear current layouts
            gameGrid.innerHTML = '';
            sidebarList.innerHTML = '';

            if(games.length === 0) {
                gameGrid.innerHTML = '<p style="color: #c5c6c7; grid-column: 1/-1;">No games found.</p>';
                return;
            }

            games.forEach(game => {
                // 1. Render Main Cards
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => launchGame(game.url);
                
                card.innerHTML = `
                    <img src="${game.image}" alt="${game.name}" onerror="this.src='https://unsplash.com';">
                    <div class="game-info">${game.name}</div>
                `;
                gameGrid.appendChild(card);

                // 2. Render Sidebar Elements
                const listItem = document.createElement('li');
                listItem.className = 'sidebar-item';
                listItem.textContent = game.name;
                listItem.onclick = () => launchGame(game.url);
                sidebarList.appendChild(listItem);
            });
        }

        // --- FILTER FUNCTION (SEARCH) ---
        searchBar.addEventListener('input', (e) => {
            const searchString = e.target.value.toLowerCase();
            const filteredGames = gamesData.filter(game => {
                return game.name.toLowerCase().includes(searchString);
            });
            renderGames(filteredGames);
        });

        // Initial Build on Page Load
        renderGames(gamesData);
